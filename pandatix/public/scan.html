<!doctype html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1B6B44">
  <title>Scan Tiket · PANDATIX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/app.css">
  <style>
    .top {
      background: var(--bg);
      border-bottom: 1px solid var(--line);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px
    }

    .top .logo {
      font-size: 20px
    }

    .wrapS {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      padding: 16px 16px 40px;
      display: flex;
      flex-direction: column;
      gap: 14px
    }

    .wh {
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 6px
    }

    .wh small {
      font-size: 11.5px;
      letter-spacing: .07em;
      text-transform: uppercase;
      color: var(--ink-2);
      font-weight: 600
    }

    .wh h1 {
      font-size: 27px
    }

    .wh .meta {
      display: flex;
      gap: 8px;
      align-items: center;
      color: var(--ink-2);
      font-size: 13px
    }

    .view {
      position: relative;
      border-radius: 26px;
      overflow: hidden;
      background: #0c1a13;
      aspect-ratio: 1;
      box-shadow: var(--shadow)
    }

    .view video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover
    }

    .view .fr {
      position: absolute;
      inset: 14%;
      border-radius: 22px;
      box-shadow: 0 0 0 100vmax rgba(0, 0, 0, .45);
      border: 3px solid rgba(255, 255, 255, .9)
    }

    .view .fr::after {
      content: "";
      position: absolute;
      left: 6%;
      right: 6%;
      height: 3px;
      border-radius: 3px;
      background: #8FC8A9;
      box-shadow: 0 0 14px #8FC8A9;
      animation: sl 2.2s ease-in-out infinite
    }

    @keyframes sl {

      0%,
      100% {
        top: 8%
      }

      50% {
        top: 90%
      }
    }

    .view .ph {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      color: #fff;
      text-align: center;
      padding: 24px;
      font-size: 14px
    }

    .stat {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px
    }

    .st {
      padding: 14px 18px
    }

    .st small {
      font-size: 11.5px;
      color: var(--ink-2);
      font-weight: 600;
      letter-spacing: .05em;
      text-transform: uppercase
    }

    .st b {
      display: block;
      font-size: 30px;
      letter-spacing: -.03em;
      margin-top: 2px
    }

    .st.ok b {
      color: var(--p)
    }

    .st.no b {
      color: var(--e)
    }

    .man {
      display: flex;
      gap: 8px;
      padding: 12px
    }

    .man .inp {
      height: 48px;
      text-transform: uppercase;
      letter-spacing: .06em;
      font-weight: 600
    }

    .rc {
      padding: 6px 0
    }

    .rc h3 {
      font-size: 15px;
      padding: 12px 18px 6px
    }

    .ri {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 11px 18px;
      border-top: 1px solid var(--line);
      font-size: 13px;
      animation: fadeUp .3s both
    }

    .ri b {
      display: block;
      font-size: 13px
    }

    .ri small {
      color: var(--ink-3);
      font-size: 11.5px
    }

    .res {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      color: #fff;
      text-align: center;
      padding: 28px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      user-select: none
    }

    .res.show {
      display: flex;
      animation: fadeUp .2s cubic-bezier(.16, 1, .3, 1) both
    }

    .res.ok {
      background: linear-gradient(180deg, #1F7A4D 0%, #165A38 100%)
    }

    .res.no {
      background: linear-gradient(180deg, #D93829 0%, #B32418 100%)
    }

    .res .big {
      width: 116px;
      height: 116px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .22);
      border: 2px solid rgba(255, 255, 255, .35);
      display: grid;
      place-items: center;
      animation: pop .4s both;
      box-shadow: 0 12px 32px rgba(0, 0, 0, .22)
    }

    .res h2 {
      font-size: 38px;
      font-weight: 800;
      color: #fff;
      line-height: 1;
      letter-spacing: .02em;
      margin-top: 4px
    }

    .res p {
      font-size: 17.5px;
      font-weight: 500;
      line-height: 1.45;
      opacity: .98;
      max-width: 420px;
      margin: 0
    }

    .res small {
      opacity: .85;
      font-size: 13.5px;
      margin-top: 6px
    }

    .res .cust {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 0, 0, .22);
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600
    }

    .res .res-btn {
      margin-top: 16px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 13px 26px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .25);
      border: 2px solid rgba(255, 255, 255, .65);
      color: #fff;
      font-size: 14.5px;
      font-weight: 700;
      letter-spacing: .02em;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .2);
      transition: transform .15s, background .15s;
      animation: pulseBtn 2s ease-in-out infinite
    }

    .res .res-btn:hover {
      background: rgba(255, 255, 255, .35);
      transform: scale(1.03)
    }

    .res .res-btn:active {
      transform: scale(.97)
    }

    @keyframes pulseBtn {

      0%,
      100% {
        box-shadow: 0 0 0 0 rgba(255, 255, 255, .45), 0 8px 24px rgba(0, 0, 0, .2)
      }

      50% {
        box-shadow: 0 0 0 10px rgba(255, 255, 255, 0), 0 8px 24px rgba(0, 0, 0, .2)
      }
    }

    .lock {
      min-height: 100vh;
      display: none;
      place-items: center;
      padding: 24px;
      text-align: center
    }

    .lock .card {
      padding: 30px;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center
    }
  </style>
</head>

<body>
  <div id="main" hidden>
    <div class="top"><span class="logo">PANDATIX</span><span class="live" id="live"><i></i><span>Terhubung</span></span>
    </div>
    <div class="wrapS">
      <div class="card wh"><small>Pos scan wahana</small>
        <h1 id="wn">…</h1>
        <div class="meta"><span class="chip" id="wk"></span><span id="pn"></span></div>
      </div>
      <div class="view"><video id="vid" muted playsinline></video>
        <div class="fr" id="fr" hidden></div>
        <div class="ph" id="ph"><span style="opacity:.9">Kamera belum aktif</span><button class="btn"
            onclick="startCam()">Aktifkan kamera</button></div>
      </div>
      <form class="card man" onsubmit="man(event)"><input class="inp" id="mc" placeholder="Ketik kode tiket (PT-XXXXXX)"
          autocomplete="off" autocapitalize="characters"><button class="btn" style="flex-shrink:0">Cek</button></form>
      <div class="stat">
        <div class="card st ok"><small>Masuk hari ini</small><b id="sok">0</b></div>
        <div class="card st no"><small>Ditolak</small><b id="sno">0</b></div>
      </div>
      <div class="card rc">
        <h3>Scan terakhir</h3>
        <div id="rec"></div>
      </div>
    </div>
  </div>
  <div class="res" id="res" onclick="hideRes()"></div>
  <div class="lock" id="lock">
    <div class="card">
      <div class="logo" style="color:var(--p);font-weight:800;font-size:26px">PANDATIX</div>
      <h3 id="lt">Link tidak valid</h3>
      <p id="lm" style="color:var(--ink-2)"></p>
    </div>
  </div>
  <script src="/vendor/jsQR.js"></script>
  <script src="/common.js"></script>
  <script>
    const TOKEN = location.pathname.split('/').pop(), H = { 'X-Scan-Token': TOKEN };
    let scn = null, busy = false, ctx = null;
    const RS = { not_found: 'Tiket tidak ditemukan', unpaid: 'Tiket belum aktif', expired: 'Tidak berlaku hari ini', wrong_ride: 'Bukan untuk wahana ini', used: 'Sudah dipakai' };
    function lockUI(t, m) { $('#main').hidden = true; $('#lock').style.display = 'grid'; $('#lt').textContent = t; $('#lm').textContent = m; if (scn) scn.stop() }
    function stats(r) {
      $('#sok').textContent = r.okCount; $('#sno').textContent = r.rejected;
      $('#rec').innerHTML = r.recent.length ? r.recent.map(s => `<div class="ri"><div><b>${esc(s.code)}</b><small>${fTimeS(s.at)}${s.nama ? ' · ' + esc(s.nama) : ''}</small></div><span class="chip ${s.result === 'ok' ? '' : 'red'}">${s.result === 'ok' ? 'Valid' : RS[s.reason] || 'Ditolak'}</span></div>`).join('') : '<div class="empty" style="padding:18px">Belum ada scan.</div>'
    }
    async function init() {
      try {
        const r = await api('/api/scan/me', { headers: H }); $('#main').hidden = false; $('#wn').textContent = r.wahana.nama; $('#wk').textContent = r.wahana.kategori; $('#pn').textContent = 'Petugas: ' + r.name; document.title = r.wahana.nama + ' · Scan PANDATIX'; stats(r);
        listen('/api/scan/stream?t=' + TOKEN, { scan: () => api('/api/scan/me', { headers: H }).then(stats).catch(() => { }), revoked: () => lockUI('Akses dicabut', 'Link scan ini dinonaktifkan atau diganti oleh admin. Minta link baru.') }, ok => { const l = $('#live'); l.classList.toggle('off', !ok); l.lastChild.textContent = ok ? 'Terhubung' : 'Terputus…' });
        startCam(true)
      }
      catch (e) { lockUI('Link tidak valid', e.message) }
    }
    async function startCam(silent) {
      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('nocam');
        scn = new Scanner($('#vid'), submit); await scn.start(); $('#ph').hidden = true; $('#fr').hidden = false
      }
      catch (e) { $('#ph').hidden = false; $('#ph').firstElementChild.textContent = location.protocol === 'http:' && location.hostname !== 'localhost' ? 'Kamera butuh HTTPS. Buka link ini lewat https:// atau gunakan input manual di bawah.' : 'Izinkan akses kamera di browser, lalu tekan tombol.' }
    }
    function man(e) { e.preventDefault(); const v = $('#mc').value.trim(); if (v) { submit(v); $('#mc').value = '' } }
    let hideT;
    function beep(ok) { try { ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = ok ? 880 : 220; o.type = ok ? 'sine' : 'square'; g.gain.value = .15; o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime + (ok ? .18 : .4)) } catch (e) { } if (navigator.vibrate) navigator.vibrate(ok ? 80 : [120, 60, 120]) }
    function showRes(ok, title, msg, sub, nama) {
      const r = $('#res');
      r.className = 'res show ' + (ok ? 'ok' : 'no');
      clearTimeout(hideT);
      const custHtml = nama ? `<div class="cust">${ico('user', 14, 2)} Pemesan: ${esc(nama)}</div>` : '';
      const actionHtml = ok
        ? `<small>${sub || 'Silakan masuk'}</small>`
        : `${custHtml}<div class="res-btn">Ketuk di mana saja untuk menutup &amp; scan lagi! </div>`;
      r.innerHTML = `<div class="big">${ico(ok ? 'check' : 'x', 64, 3)}</div><h2>${title}</h2><p>${msg}</p>${actionHtml}`;
      beep(ok);
      if (ok) hideT = setTimeout(hideRes, 1800);
    }
    function hideRes() {
      $('#res').classList.remove('show');
      if (scn) { scn.pause(1000); scn.last = '' }
    }
    async function submit(code) {
      if (busy || $('#res').classList.contains('show')) return;
      busy = true; scn && scn.pause(2200);
      try {
        const r = await api('/api/scan/redeem', { method: 'POST', headers: H, body: { code } });
        stats(r);
        if (r.ok) {
          showRes(true, 'VALID', `<b>${esc(r.nama)}</b> · tiket ${r.ticketNo} dari ${r.total}<br>${esc(r.tiket)}`, 'Silakan masuk');
        } else {
          let msg = esc(r.msg);
          if (r.reason === 'not_found') {
            msg = 'Waduh, tiketnya gaib nih! Nggak ketemu di sistem <br><span style="font-size:14px;opacity:.9">Coba periksa lagi atau scan ulang kodenya ya!</span>';
          } else if (r.reason === 'used') {
            msg = `Yah, tiket ini udah dipakai seru-seruan tadi pukul <b>${fTime(r.usedAt)} WIB</b>! <br><span style="font-size:14px;opacity:.9">Satu tiket hanya berlaku untuk sekali masuk wahana ya!</span>`;
          } else if (r.reason === 'unpaid') {
            msg = 'Ups! Tiket ini belum aktif atau belum lunas nih <br><span style="font-size:14px;opacity:.9">Silakan selesaikan pembayaran di kasir terlebih dahulu.</span>';
          } else if (r.reason === 'expired') {
            msg = 'Waduh, masa berlaku tiket ini sudah lewat nih <br><span style="font-size:14px;opacity:.9">Tiket tidak berlaku untuk hari ini.</span>';
          } else if (r.reason === 'wrong_ride') {
            msg = `Wah salah pintu wahana nih! <br><span style="font-size:14px;opacity:.9">${esc(r.msg)}</span>`;
          }
          showRes(false, 'DITOLAK!', msg, '', r.nama);
        }
      } catch (e) {
        if (e.status === 401) lockUI('Akses dicabut', e.message);
        else showRes(false, 'GAGAL!', `Waduh terjadi kendala: ${esc(e.message)}<br><span style="font-size:14px;opacity:.9">Yuk coba scan sekali lagi!</span>`);
      } finally {
        busy = false;
      }
    }
    init();
  </script>
</body>

</html>
