<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff Keuangan · PANDATIX</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/app.css"></head><body>
<script src="/common.js"></script><script src="/staff.js"></script>
<script>
let range='7d',R=null;
Shell.boot({roles:['keuangan'],roleLabel:'Staff Keuangan',idPrefix:'STAFF',onReady(main){
  main.innerHTML=`<div class="ttl"><div><h1>Laporan Pemasukan Tiket</h1><p>Pemantauan transaksi harian dan akumulasi pendapatan wisata real-time.</p></div>
  <div class="tools"><div class="seg" id="rg"><button data-r="7d" class="on">7 Hari</button><button data-r="bulan">Bulan Ini</button><button data-r="semua">Semua</button></div><a class="btn-w" id="exp" href="/api/keuangan/export?range=7d">${ico('dl',16,2)}Unduh Laporan</a></div></div>
  <div class="kpis" id="kp"></div><div class="cols"><section class="card pnl" id="ch"></section><section class="card pnl" id="hs"></section></div>`;
  $$('#rg button').forEach(b=>b.onclick=()=>{range=b.dataset.r;$$('#rg button').forEach(x=>x.classList.toggle('on',x===b));$('#exp').href='/api/keuangan/export?range='+range;load(false)});
  load(true);const d=debounce(()=>load(false),150);Shell.stream({order:d,_reconnect:d});
}});
async function load(anim){try{R=await api('/api/keuangan/report?range='+range);draw(anim)}catch(e){toast(e.message,true)}}
const dm=k=>{const [y,m,d]=k.split('-');return +d+' '+BL[+m-1]};
const dfull=k=>{const dt=new Date(k+'T12:00:00Z');return HR[dt.getUTCDay()]+', '+dm(k)+' '+dt.getUTCFullYear()};
let prev={};
function count(el,to,fmt){const from=prev[el.id]||0;prev[el.id]=to;if(from===to||matchMedia('(prefers-reduced-motion:reduce)').matches){el.textContent=fmt(to);return}const t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/700),e=1-Math.pow(1-p,3);el.textContent=fmt(Math.round(from+(to-from)*e));if(p<1)requestAnimationFrame(f)})(t0)}
function draw(anim){
  const mo=R.todayKey.slice(0,7),[yy,mm]=mo.split('-');
  const K=[['Pemasukan hari ini',R.today.total,R.today.trx+' transaksi terkonfirmasi','Hari ini'],['Pemasukan kemarin',R.yesterday.total,R.yesterday.trx+' transaksi',dm(R.yesterdayKey)],['Pemasukan bulan ini',R.month.total,R.month.trx+' transaksi tercatat',BL[+mm-1]+' '+yy],['Total keseluruhan',R.all.total,'Akumulasi revenue','Valid']];
  $('#kp').innerHTML=K.map((k,i)=>`<div class="card kpi fade-up" style="animation-delay:${i*70}ms"><small>${k[0]}${i===3?'<span class="chip" style="font-size:10px;height:19px;letter-spacing:0;text-transform:none">Semua Waktu</span>':''}</small><div class="v" id="kv${i}">${rp(0)}</div><div class="f"><span>${k[2]}</span><span>${k[3]}</span></div></div>`).join('');
  K.forEach((k,i)=>count($('#kv'+i),k[1],rp));
  const max=Math.max(...R.days.map(d=>d.total),0);const first=R.days[0],last=R.days[6];
  $('#ch').innerHTML=`<div class="pnl-h"><div><h3>Pemasukan 7 Hari Terakhir</h3><p>Grafik pendapatan tiket per hari (${dm(first.key).split(' ')[0]} - ${dm(last.key)})</p></div><span class="lgd"><i></i>Pemasukan</span></div>
  <div class="chart" style="padding-top:30px">${R.days.map((d,i)=>{const h=d.total?Math.max(14,Math.round(d.total/max*165)):5;const top=d.total&&d.total===max,td=i===6;
    return `<div class="bar ${top?'top':''} ${td?'today':''}">${d.total?`<span class="bv">${d.total.toLocaleString('id-ID')}</span>`:''}<div class="col ${d.total?'':'z'}" style="${d.total?'height:'+h+'px;':''}animation-delay:${i*80}ms"></div><div class="lb">${HR[d.dow]}<small>${d.label}</small></div></div>`}).join('')}</div>
  <div class="cfoot"><span><i></i>Hari ini (${HR[last.dow]} ${last.label}) sedang berjalan</span><span>Tertinggi: ${rp(max)} / hari</span></div>`;
  const rows=R.rows;$('#hs').innerHTML=`<div class="pnl-h"><div><h3>Riwayat Pemasukan</h3><p>Daftar transaksi harian terverifikasi</p></div><span class="chip" style="height:30px;padding:0 14px;font-size:12px">${rows.length} Catatan</span></div>
  <table class="tb"><thead><tr><th>Tanggal</th><th>Trx</th><th>Tiket</th><th>Pemasukan</th></tr></thead><tbody>${rows.length?rows.slice(0,range==='semua'?60:6).map((r,i)=>`<tr style="animation-delay:${i*50}ms"><td><b>${dfull(r.key)}</b><small>${esc(r.ket)}</small></td><td>${r.trx}</td><td>${r.tiket}</td><td>${rp(r.total)}</td></tr>`).join(''):''}</tbody></table>${rows.length?'':'<div class="empty">Belum ada transaksi pada periode ini.</div>'}
  ${range!=='semua'&&rows.length?`<div style="text-align:center;margin-top:18px"><button class="lnk" onclick="range='semua';$$('#rg button').forEach(x=>x.classList.toggle('on',x.dataset.r==='semua'));load(false)">Lihat Semua Riwayat ${ico('right',14,2.5)}</button></div>`:''}`;
}
</script></body></html>
