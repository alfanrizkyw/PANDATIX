<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kasir · PANDATIX</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/app.css">
<style>
.kg{display:grid;grid-template-columns:1.45fr 1fr;gap:26px;align-items:start}
.pn{overflow:hidden}
.pn-h{display:flex;align-items:center;gap:10px;padding:20px 24px;border-bottom:1px solid var(--line);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.pn-h i{width:9px;height:9px;border-radius:50%;background:var(--p);animation:pulse 1.6s infinite}
.pn-h .chip{border:1px solid var(--p);background:var(--p-cont);height:22px;letter-spacing:.04em;font-size:10.5px}
.pn-b{padding:24px}
.tp{display:grid;grid-template-columns:.85fr 1.15fr;gap:16px;margin-bottom:26px}
.stbox{border:1.5px solid var(--p);border-radius:20px;background:var(--p-cont);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px;gap:12px;min-height:210px;animation:pop .45s both}
.stbox small{font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--p);text-transform:uppercase}
.stbox b{font-size:28px;line-height:1.05;color:var(--p);font-weight:800;letter-spacing:-.04em;text-transform:uppercase}
.stbox.pend{border-color:var(--s);background:var(--s-cont)}.stbox.pend small,.stbox.pend b{color:var(--s-dark)}
.dt{border:1.5px solid var(--line);border-radius:20px;padding:6px 18px}
.dt div{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid var(--line);font-size:13.5px;font-weight:700}
.dt div:last-child{border:0}.dt span{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.dt .code{border:1.5px solid var(--p);background:var(--p-cont);color:var(--p);border-radius:8px;padding:5px 12px;letter-spacing:.06em}
.rh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px;flex-wrap:wrap}.rh h4{font-size:15px}
.ix{display:flex;align-items:center;gap:14px;border:1.5px solid var(--line);border-radius:16px;padding:14px 18px;margin-bottom:10px;animation:fadeUp .4s both}
.ix .ck{width:40px;height:40px;border-radius:12px;background:var(--p-cont);color:var(--p);display:grid;place-items:center;flex-shrink:0}
.ix .i{flex:1;min-width:0}.ix b{display:block;font-size:15px}.ix small{font-size:12px;color:var(--ink-2)}
.ix .pr{text-align:right}.ix .pr b{font-size:16px}.ix .pr small{color:var(--p);font-weight:700}
.sm{display:flex;justify-content:space-between;color:var(--ink-2);font-size:15px;padding:6px 0}.sm b{color:var(--ink);font-weight:500}
.tot{display:flex;justify-content:space-between;align-items:flex-end;border-top:1.5px solid var(--line);margin-top:10px;padding-top:18px;gap:10px}
.tot h4{font-size:19px}.tot small{display:block;color:var(--p);font-weight:700;font-size:12.5px;margin-top:6px}.tot b{font-size:34px;color:var(--p);letter-spacing:-.04em;font-weight:700}
.hr{display:flex;flex-direction:column}
.hi{display:flex;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);text-align:left;width:100%;transition:background .15s;animation:fadeUp .4s both}
.hi:last-child{border:0}.hi:hover{background:var(--surface)}
.hi.on{background:var(--p-cont);box-shadow:inset 4px 0 0 var(--p)}
.hi b{display:block;font-size:13.5px}.hi small{font-size:11.5px;color:var(--ink-2)}
.hi .r{text-align:right}.hi .r b{color:var(--ink)}.hi.on .r b{color:var(--p)}.hi .r small{display:block;margin-top:6px;font-size:11px}
.hl{border:1.5px solid var(--line);border-radius:16px;overflow:hidden;margin:16px 0 0}
.scan-card{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:22px;padding:18px 20px}
.scan-card .f{flex:1;min-width:200px;display:flex;gap:8px}.scan-card .inp{height:46px}
.cam{position:fixed;inset:0;z-index:120;background:#0c1a13;display:none;flex-direction:column}
.cam.show{display:flex}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam .tp2{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:16px;color:#fff;font-weight:700}
.cam .fr{position:relative;z-index:2;margin:auto;width:min(72vw,300px);aspect-ratio:1;border-radius:26px;box-shadow:0 0 0 100vmax rgba(0,0,0,.55)}
.cam .fr::before,.cam .fr::after{content:"";position:absolute;inset:0;border:3px solid #fff;border-radius:26px;clip-path:polygon(0 0,30% 0,30% 3px,3px 3px,3px 30%,0 30%,0 0,100% 0,100% 30%,calc(100% - 3px) 30%,calc(100% - 3px) 3px,70% 3px,70% 0,100% 0,100% 100%,70% 100%,70% calc(100% - 3px),calc(100% - 3px) calc(100% - 3px),calc(100% - 3px) 70%,100% 70%,100% 100%,0 100%,0 70%,3px 70%,3px calc(100% - 3px),30% calc(100% - 3px),30% 100%,0 100%)}
.cam p{position:relative;z-index:2;text-align:center;color:#fff;padding:16px 20px 34px;font-size:13.5px}
.cam .x{background:rgba(255,255,255,.2);color:#fff;width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
@media(max-width:1000px){.kg{grid-template-columns:1fr}}
@media(max-width:600px){.tp{grid-template-columns:1fr}.pn-b{padding:16px}.tot b{font-size:26px}.stbox{min-height:130px}.stbox b{font-size:23px}}
</style></head><body>
<script src="/vendor/qrcode.js"></script><script src="/vendor/jsQR.js"></script><script src="/common.js"></script><script src="/staff.js"></script>
<script>
let latest=null,hist=[],sel=null,scn=null,pending=null,busy=false;
Shell.boot({roles:['kasir'],roleLabel:'Kasir',idPrefix:'KASIR',onReady(main,u){
  main.innerHTML=`<div class="ttl" style="margin-bottom:22px"><div><h1>Kasir Loket</h1><p>Pemrosesan tiket masuk pengunjung Lembah Pandawa real-time.</p></div></div>
  <div class="card scan-card"><button class="btn" onclick="openCam()">${ico('cam',18,2)} Scan QR Pesanan</button><form class="f" onsubmit="manual(event)"><input class="inp" id="mc" placeholder="atau ketik kode, cth. PTX-1234-5678" autocapitalize="characters" autocomplete="off"><button class="btn btn-out" style="flex-shrink:0">Cari</button></form><span class="chip brown" id="pc" style="height:30px;padding:0 14px"></span></div>
  <div class="kg"><section class="card pn" id="L"></section><section class="card pn" id="Rr"></section></div>
  <div class="cam" id="cam"><video id="vid" muted playsinline></video><div class="tp2"><span>Arahkan ke QR pesanan pelanggan</span><button class="x" onclick="closeCam()" aria-label="Tutup">${ico('x',20,2.4)}</button></div><div class="fr"></div><p id="camMsg">Menyiapkan kamera…</p></div>`;
  loadHist().then(()=>{const q=new URLSearchParams(location.search).get('order');if(q){history.replaceState(null,'','/kasir');lookup(q)}});
  const d=debounce(loadHist,150);Shell.stream({order:d,_reconnect:d});
}});
async function loadHist(){try{const r=await api('/api/kasir/history');hist=r.orders;$('#pc').textContent=r.pending+' pesanan menunggu';if(!sel&&!pending)latest=hist[0]||null;drawL();drawR()}catch(e){}}
async function lookup(code){
  try{const o=await api('/api/kasir/lookup?code='+encodeURIComponent(code));
    if(o.status==='confirmed'){toast('Pesanan ini sudah dikonfirmasi.');sel=o.id;latest=o;pending=null;await loadHist();return}
    if(o.status!=='pending'){toast('Pesanan kedaluwarsa. Minta pelanggan pesan ulang.',true);return}
    pending=o;drawL();window.scrollTo({top:0,behavior:'smooth'})}catch(e){toast(e.message,true)}
}
function manual(e){e.preventDefault();const v=$('#mc').value.trim();if(v){lookup(v);$('#mc').value=''}}
async function confirmNow(){
  if(busy||!pending)return;busy=true;const b=$('#cf');b.disabled=true;b.innerHTML='<span class="spin"></span> Memproses…';
  try{const o=await api('/api/kasir/confirm',{method:'POST',body:{code:pending.code}});toast('Pembayaran dikonfirmasi — tiket diterbitkan');pending=null;latest=o;sel=o.id;await loadHist()}
  catch(e){toast(e.message,true);if(e.status===409||e.status===410){pending=null}drawL()}finally{busy=false}
}
const nTiket=o=>o.items.reduce((s,i)=>s+i.qty,0);
const mName={tunai:'Tunai Loket',qris:'QRIS'};
const methodName=id=>mName[id]||'Metode lama';
const subOf=i=>i.type==='paket'?'Paket wisata':'Wahana';
function drawL(){
  const el=$('#L');
  if(pending){const o=pending;el.innerHTML=`<div class="pn-h"><i style="background:var(--s)"></i>Menunggu konfirmasi <span class="chip brown">Perlu tindakan</span></div><div class="pn-b">${body(o,true)}</div>`;return}
  const o=latest;
  if(!o){el.innerHTML=`<div class="pn-h"><i></i>Transaksi terbaru <span class="chip">LIVE</span></div><div class="pn-b"><div class="empty">Belum ada transaksi. Scan QR pesanan pelanggan untuk memulai.</div></div>`;return}
  el.innerHTML=`<div class="pn-h"><i></i>Transaksi terbaru <span class="chip">LIVE</span></div><div class="pn-b">${body(o,false)}</div>`;
}
function body(o,pend){
  const n=nTiket(o),d=o.confirmedAt||o.createdAt;
  return `<div class="tp"><div class="stbox ${pend?'pend':''}"><small>${pend?'Status pesanan':'Status tiket loket'}</small><b>${pend?'Menunggu<br>pembayaran':n+' tiket<br>diterbitkan'}</b></div>
  <div class="dt"><div><span>Pemesan</span>${esc(o.nama)}</div><div><span>Jam transaksi</span>${fTimeS(d).replace(/\./g,'.')} WIB</div><div><span>Tanggal</span>${HF[W(d).getUTCDay()]}, ${fDate(d)}</div><div><span>Metode bayar</span>${methodName(o.method)}</div><div><span>Kode booking</span><b class="code">${o.code}</b></div></div></div>
  <div class="rh"><h4>Rincian Tiket Masuk <span class="chip" style="margin-left:6px;font-size:10px;background:var(--p-cont)">${o.items.length>1||n>1?'TIKET MULTI':'TIKET SATUAN'}</span></h4><span class="chip line" style="height:26px;${pend?'border-color:var(--s);color:var(--s)':''}">${pend?'● BELUM DIBAYAR':'● TERKONFIRMASI'}</span></div>
  ${o.items.map((i,k)=>`<div class="ix" style="animation-delay:${k*60}ms"><span class="ck">${ico('check',20,2.4)}</span><div class="i"><b>${esc(i.name)}</b><small>${subOf(i)} • ${i.qty} tiket × ${rp(i.price)}</small></div><div class="pr"><b>${rp(i.price*i.qty)}</b><small>${i.qty} Tiket</small></div></div>`).join('')}
  ${o.items.map(i=>`<div class="sm"><span>${esc(i.name)} × ${i.qty}</span><b>${rp(i.price*i.qty)}</b></div>`).join('')}<div class="sm"><span>Biaya admin loket</span><b>${rp(o.fee)}</b></div>
  <div class="tot"><div><h4>Total Akhir</h4><small>${pend?'Terima pembayaran '+methodName(o.method).toLowerCase()+' lalu konfirmasi':'Sudah dibayar '+(o.method==='tunai'?'tunai ':'')+'(Lunas)'}</small></div><b>${rp(o.total)}</b></div>
  ${pend?`<div style="display:flex;gap:10px;margin-top:20px"><button class="btn block" id="cf" onclick="confirmNow()">${ico('checkc',20,2)} Konfirmasi pembayaran</button><button class="btn btn-out" onclick="pending=null;drawL()">Batal</button></div>`:''}`;
}
function drawR(){
  $('#Rr').innerHTML=`<div class="pn-b" style="padding-bottom:18px"><div class="rh" style="margin:0"><h4>Riwayat Transaksi Loket <span class="chip" style="margin-left:6px">${hist.length} Catatan</span></h4><button class="lnk" onclick="loadHist()">Refresh</button></div>
  <div class="hl hr">${hist.length?hist.map((o,i)=>`<button class="hi ${(!pending&&(sel?o.id===sel:i===0))?'on':''}" style="animation-delay:${i*40}ms" onclick="pick('${o.id}')"><div><b>${esc(o.nama)}</b><small>${fTime(o.confirmedAt)} WIB • ${esc(o.items.map(x=>x.name).join(', ').slice(0,40))} (${nTiket(o)} Tiket)</small></div><div class="r"><b>${rp(o.total)}</b><small>Selesai</small></div></button>`).join(''):'<div class="empty">Belum ada riwayat.</div>'}</div></div>`;
}
function pick(id){const o=hist.find(x=>x.id===id);if(o){sel=id;latest=o;pending=null;drawL();drawR()}}
async function openCam(){
  $('#cam').classList.add('show');$('#camMsg').textContent='Menyiapkan kamera…';
  try{if(!navigator.mediaDevices)throw 0;scn=new Scanner($('#vid'),v=>{scn.pause(2500);closeCam();lookup(v)});await scn.start();$('#camMsg').textContent='Arahkan kamera ke QR di layar HP pelanggan'}
  catch(e){$('#camMsg').textContent='Kamera tidak dapat diakses. Gunakan HTTPS & izinkan kamera, atau ketik kode pesanan.'}
}
function closeCam(){$('#cam').classList.remove('show');if(scn){scn.stop();scn=null}}
</script></body></html>
