<!doctype html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1B6B44">
  <meta name="description"
    content="Pesan tiket wahana Lembah Pandawa — Bali Van Java, Pandaan. Pilih paket, bayar, tiket QR langsung terbit.">
  <title>PANDATIX · Tiket Wahana Lembah Pandawa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/app.css?v=glass4">
  <style>
    html {
      scroll-behavior: auto
    }

    :root {
      --hh: 63px
    }

    @media(max-width:560px) {
      :root {
        --hh: 61px
      }
    }

    @media(max-width:340px) {
      :root {
        --hh: 55px
      }
    }

    .page {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 18px 16px 40px;
      animation: fadeUp .4s cubic-bezier(.22, .9, .3, 1) both
    }

    .narrow {
      max-width: 640px
    }

    .bleed {
      width: 100vw;
      margin-left: calc(50% - 50vw)
    }

    /* header */
    #shellTop {
      display: contents;
    }

    .hdr {
      position: sticky;
      top: 0;
      z-index: 50;
      background: transparent !important;
      border: 0 !important;
      border-bottom: 0 !important;
      box-shadow: none !important;
      -webkit-backdrop-filter: none !important;
      backdrop-filter: none !important;
      transition: background .22s ease, box-shadow .22s ease;
    }

    .hdr::after {
      display: none !important;
    }

    body.not-home .hdr {
      background: #143A2B !important;
      box-shadow: 0 4px 18px rgba(8, 32, 22, .24) !important;
    }

    body.is-scrolled.is-home .hdr {
      background: #0E2E20 !important;
      -webkit-backdrop-filter: none !important;
      backdrop-filter: none !important;
      box-shadow: 0 4px 20px rgba(8, 32, 22, .3) !important;
    }

    .hdr .hwrap {
      max-width: 1100px;
      gap: 16px;
      padding: 0 20px;
      height: var(--hh);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .hdr .logo {
      font-weight: 800;
      font-size: 26px;
      letter-spacing: -.03em;
      color: #ffffff !important;
      line-height: 1;
      text-shadow: 0 2px 8px rgba(0, 0, 0, .4);
      text-decoration: none;
    }

    .hspacer {
      flex: 1;
      min-width: 0;
    }

    .hactions {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }

    .hdr-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      color: #ffffff;
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 0;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, .35));
      transition: transform .12s, opacity .15s;
    }

    .hdr-btn:hover {
      opacity: .82;
    }

    .hdr-btn:active {
      transform: scale(.92);
    }

    .hdr-cart-badge {
      position: absolute;
      top: 1px;
      right: 1px;
      background: #E11D48;
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      min-width: 17px;
      height: 17px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
      border: 2px solid #fff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, .35);
    }

    @media(max-width:560px) {
      .hdr .hwrap {
        padding: 0 16px;
      }

      .hdr .logo {
        font-size: 23px;
      }

      .hactions {
        gap: 12px;
      }

      .hdr-btn {
        width: 36px;
        height: 36px;
      }
    }

    /* search modal */
    #searchModal {
      display: none;
      align-items: flex-start;
      justify-content: center;
      padding: 16px 14px 24px;
    }

    #searchModal.show {
      display: flex;
      animation: searchBackdropFade .2s ease-out both;
    }

    #searchModal .sm-box {
      margin-top: 6px;
      animation: searchSlideFromTop .32s cubic-bezier(.16, 1, .3, 1) both;
      box-shadow: 0 25px 60px -15px rgba(8, 34, 24, .45), 0 0 0 1px rgba(0, 0, 0, .06);
    }

    @keyframes searchBackdropFade {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes searchSlideFromTop {
      from {
        opacity: 0;
        transform: translateY(-70px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .sm-head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .sm-inp-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      background: var(--surface);
      border: 1.5px solid var(--line);
      border-radius: 7px;
      padding: 0 11px;
      height: 42px;
      gap: 8px;
      transition: border-color .15s, box-shadow .15s;
    }

    .sm-inp-wrap:focus-within {
      border-color: var(--p);
      box-shadow: 0 0 0 3px rgba(27, 107, 68, .12);
      background: #fff;
    }

    .sm-icon {
      color: var(--ink-3);
      display: flex;
    }

    .sm-input {
      flex: 1;
      border: none;
      background: transparent;
      outline: none;
      font-size: 14px;
      color: var(--ink);
    }

    .sm-input::placeholder {
      color: var(--ink-3);
    }

    .sm-clear {
      display: none;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 5px;
      background: rgba(0, 0, 0, .07);
      color: var(--ink-2);
      cursor: pointer;
    }

    .sm-clear:hover {
      background: rgba(0, 0, 0, .14);
    }

    .sm-results {
      max-height: min(60vh, 380px);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-right: 2px;
    }

    .sm-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--ink-3);
      padding: 4px 2px;
    }

    .sm-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 10px;
      border-radius: 7px;
      border: 1px solid transparent;
      background: #fff;
      text-align: left;
      cursor: pointer;
      transition: background .12s, border-color .12s, transform .1s;
    }

    .sm-item:hover {
      background: var(--p-cont);
      border-color: rgba(27, 107, 68, .2);
      transform: translateX(2px);
    }

    .sm-thumb {
      width: 44px;
      height: 44px;
      border-radius: 6px;
      background-size: cover;
      background-position: center;
      flex-shrink: 0;
    }

    .sm-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .sm-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sm-name {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sm-tag {
      font-size: 9.5px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 3px;
      color: #fff;
    }

    .sm-desc {
      font-size: 11.5px;
      color: var(--ink-3);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sm-price {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
      flex-shrink: 0;
    }

    .sm-price b {
      font-size: 13px;
      color: var(--p);
      font-weight: 800;
    }

    .sm-view {
      font-size: 10.5px;
      color: var(--ink-3);
      display: inline-flex;
      align-items: center;
      gap: 2px;
    }

    .sm-empty {
      padding: 32px 16px;
      text-align: center;
      color: var(--ink-3);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .sm-empty p {
      font-size: 13.5px;
      margin: 0;
    }

    @media(max-width:600px) {
      #searchModal {
        padding: 8px 10px 18px;
        align-items: flex-start;
      }

      #searchModal .sm-box {
        margin-top: 0;
        max-height: calc(100dvh - 20px);
      }
    }

    /* footer: dark panel with Balinese temple landscape on top */
    .ftr {
      position: relative;
      margin-top: 54px;
      background: transparent;
      border: 0;
      padding: 0;
      color: #E2EFE7;
      overflow: hidden
    }

    .ftr .ftr-art {
      display: block;
      width: 100%;
      line-height: 0;
      margin-bottom: -1px;
      pointer-events: none;
      user-select: none;
      overflow: hidden
    }

    .ftr .ftr-art-img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 280px;
      object-fit: cover;
      object-position: center top;
      margin: 0 auto
    }

    .ftr .fp {
      background: #1B6B44;
      padding: 8px 0 46px
    }

    .ftr .wrap {
      max-width: 1100px
    }

    .ftr .lg {
      display: block;
      font-weight: 800;
      font-size: 30px;
      letter-spacing: -.03em;
      color: #fff;
      margin: 0 0 15px
    }

    .ftr .ds {
      font-size: 16px;
      line-height: 1.6;
      color: rgba(255, 255, 255, .88);
      max-width: 560px;
      margin: 0 0 30px
    }

    .ftr .fi {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      margin: 0 0 21px
    }

    .ftr .fi .ic {
      color: #fff;
      margin-top: 1px;
      display: flex;
      opacity: .95
    }

    .ftr .fi b {
      display: block;
      color: #fff;
      font-size: 15.5px;
      font-weight: 700;
      line-height: 1.35
    }

    .ftr .fi .tx span {
      display: block;
      color: rgba(255, 255, 255, .86);
      font-size: 15px;
      line-height: 1.5;
      margin-top: 2px
    }

    .ftr .ig {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      height: 48px;
      padding: 0 22px;
      border-radius: 999px;
      border: 1.5px solid rgba(255, 255, 255, .32);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      margin-top: 7px;
      transition: background .2s, border-color .2s
    }

    .ftr .ig:hover {
      background: rgba(255, 255, 255, .12);
      border-color: rgba(255, 255, 255, .55)
    }

    .ftr .hr {
      height: 1px;
      background: rgba(255, 255, 255, .18);
      margin: 30px 0 20px
    }

    .ftr .cp {
      font-size: 14.5px;
      color: rgba(255, 255, 255, .72);
      margin: 0
    }

    /* hero: illustrated valley scene with gentle environmental motion */
    .hero {
      position: relative;
      z-index: 2;
      isolation: isolate;
      background: #6E93A3;
      margin-top: calc(-1*var(--hh));
      padding-top: var(--hh)
    }

    .hero-art {
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none
    }

    .hero-art img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 48%;
    }

    .hero-art svg {
      display: block;
      width: 100%;
      height: 100%
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(8, 28, 20, 0.08) 0%, rgba(8, 28, 20, 0.18) 40%, rgba(8, 28, 20, 0.65) 100%),
        linear-gradient(90deg, rgba(8, 28, 20, 0.52) 0%, rgba(8, 28, 20, 0.22) 48%, rgba(8, 28, 20, 0) 78%);
    }

    .hero-in {
      position: relative;
      z-index: 2;
      max-width: 1100px;
      margin: 0 auto;
      min-height: 520px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 12px;
      padding: 26px 20px 44px
    }

    .hero-curve {
      position: absolute;
      left: 0;
      right: 0;
      bottom: -1px;
      z-index: 2;
      line-height: 0;
      pointer-events: none
    }

    .hero-curve svg {
      display: block;
      width: 100%;
      height: 34px
    }

    .hero-art .cl {
      animation: hcl 160s ease-in-out infinite alternate;
      will-change: transform
    }

    .hero-art .tr {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      animation: hsway 9s ease-in-out infinite alternate;
      will-change: transform
    }

    .hero-art .wv {
      animation: hwv 22s ease-in-out infinite alternate;
      will-change: transform
    }

    .hero-art .bk {
      animation: hbk 180s ease-in-out infinite alternate;
      will-change: transform
    }

    .hero-art .wing {
      transform-box: fill-box;
      transform-origin: 50% 65%;
      animation: hflap 3.2s ease-in-out infinite
    }

    .hero-art .cl {
      transform-box: fill-box
    }

    .hero-art .lv {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      animation: hsway 11s ease-in-out infinite alternate;
      will-change: transform
    }

    .hero-art .lf {
      transform-box: fill-box;
      transform-origin: 50% 50%;
      animation: hleaf 16s ease-in-out infinite alternate;
      will-change: transform
    }

    .hero-art .gl {
      animation: hgl 9s ease-in-out infinite alternate;
      will-change: opacity
    }

    @keyframes hcl {
      from {
        transform: translateX(-34px)
      }

      to {
        transform: translateX(34px)
      }
    }

    @keyframes hsway {
      from {
        transform: rotate(-.7deg)
      }

      to {
        transform: rotate(.9deg)
      }
    }

    @keyframes hwv {
      from {
        transform: translateX(-12px)
      }

      to {
        transform: translateX(12px)
      }
    }

    @keyframes hbk {
      from {
        transform: translateX(-34px)
      }

      to {
        transform: translateX(34px)
      }
    }

    @keyframes hflap {

      0%,
      100% {
        transform: scaleY(1)
      }

      50% {
        transform: scaleY(.5)
      }
    }

    @keyframes wxpace {
      from {
        transform: translateX(0)
      }

      to {
        transform: translateX(138px)
      }
    }

    @keyframes wxbob {
      from {
        transform: translateY(1px) rotate(-1.3deg)
      }

      to {
        transform: translateY(-2px) rotate(1.5deg)
      }
    }

    @keyframes hleaf {
      from {
        transform: translate(0, 0) rotate(-12deg)
      }

      to {
        transform: translate(-42px, 30px) rotate(26deg)
      }
    }

    @keyframes hgl {
      from {
        opacity: .28
      }

      to {
        opacity: .72
      }
    }

    .wxwrap {
      position: relative;
      align-self: flex-start;
      padding-top: 27px;
      animation: fadeUp .6s .05s both
    }

    .wxship {
      position: absolute;
      left: 5px;
      top: 0;
      width: 46px;
      height: 27px;
      display: flex;
      align-items: flex-end;
      pointer-events: none;
      animation: wxpace 15s ease-in-out infinite alternate;
      will-change: transform
    }

    .wxship svg {
      display: block;
      width: 100%;
      height: auto;
      filter: drop-shadow(0 2px 3px rgba(10, 32, 24, .3));
      transform-origin: 50% 88%;
      animation: wxbob 5.2s ease-in-out infinite alternate;
      will-change: transform
    }

    .wx {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      height: 38px;
      padding: 0 17px;
      border-radius: 999px;
      background: linear-gradient(150deg, rgba(255, 255, 255, .34), rgba(255, 255, 255, .14));
      border: 1px solid rgba(255, 255, 255, .5);
      -webkit-backdrop-filter: blur(16px) saturate(1.7);
      backdrop-filter: blur(16px) saturate(1.7);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      text-shadow: 0 1px 6px rgba(6, 28, 20, .4);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .58), 0 10px 24px -16px rgba(6, 28, 20, .7)
    }

    .wx b {
      font-weight: 700
    }

    .wx s {
      width: 1px;
      height: 16px;
      background: rgba(255, 255, 255, .5)
    }

    .wx .sun {
      color: #F6C85B;
      display: inline-flex
    }

    .hero h1 {
      color: #fff;
      font-size: clamp(29px, 4.6vw, 44px);
      line-height: 1.14;
      max-width: 620px;
      font-weight: 700;
      letter-spacing: -.025em;
      text-shadow: 0 2px 12px rgba(10, 32, 24, .42), 0 1px 2px rgba(10, 32, 24, .28);
      animation: fadeUp .6s .12s both
    }

    .hero p {
      color: rgba(255, 255, 255, .93);
      font-size: 15px;
      line-height: 1.55;
      max-width: 480px;
      text-shadow: 0 1px 8px rgba(10, 32, 24, .55), 0 1px 2px rgba(10, 32, 24, .35);
      animation: fadeUp .6s .2s both
    }

    @media(max-width:480px) {
      .hero h1 {
        font-size: 28px;
        letter-spacing: -.045em;
        line-height: 1.16
      }
    }

    @media(max-width:700px) {
      .hero-in {
        min-height: 520px;
        padding-bottom: 46px
      }

      .hero-curve svg {
        height: 30px
      }

      .ftr .ftr-art-img {
        max-height: 200px
      }

      .ftr .lg {
        font-size: 26px
      }

      .ftr .ds {
        font-size: 15px
      }

      .ftr .fi .tx span {
        font-size: 14.5px
      }

      .ftr .fp {
        padding-top: 0;
        padding-bottom: 38px
      }
    }

    @media(prefers-reduced-motion:reduce) {

      .hero-art .cl,
      .hero-art .tr,
      .hero-art .wv,
      .hero-art .bk,
      .hero-art .wing,
      .hero-art .lv,
      .hero-art .lf,
      .hero-art .gl,
      .wxship,
      .wxship svg {
        animation: none
      }
    }

    /* search */
    .search {
      position: relative;
      z-index: 20;
      animation: fadeUp .6s .28s both
    }

    .sbar {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 60px;
      padding: 0 8px 0 25px;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(255, 255, 255, .74), rgba(255, 255, 255, .56));
      border: 1px solid rgba(255, 255, 255, .8);
      -webkit-backdrop-filter: blur(22px) saturate(1.7);
      backdrop-filter: blur(22px) saturate(1.7);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .9), 0 18px 36px -20px rgba(8, 34, 24, .7);
      transition: border-color .18s, box-shadow .18s
    }

    .sbar:focus-within,
    .sbar.open {
      border-color: rgba(27, 107, 68, .5);
      box-shadow: 0 0 0 4px rgba(27, 107, 68, .16), inset 0 1px 0 rgba(255, 255, 255, .95), 0 18px 36px -20px rgba(8, 34, 24, .7)
    }

    .sbar input {
      flex: 1;
      min-width: 0;
      height: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      font-size: 15.5px;
      color: var(--ink)
    }

    .sbar input::placeholder {
      color: #4F5E56
    }

    .sgo {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: linear-gradient(180deg, #1E7A4A, #166534);
      color: #fff;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .22), 0 6px 14px -8px rgba(10, 50, 30, .8);
      transition: .15s
    }

    .sgo:hover {
      background: linear-gradient(180deg, #248A55, #1B7A42)
    }

    .sgo:active {
      transform: scale(.92)
    }

    .sug {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 8px);
      background: rgba(255, 255, 255, .92);
      border: 1px solid rgba(27, 107, 68, .32);
      border-radius: 20px;
      padding: 6px;
      -webkit-backdrop-filter: blur(24px) saturate(1.6);
      backdrop-filter: blur(24px) saturate(1.6);
      box-shadow: 0 22px 44px -20px rgba(18, 72, 46, .5), inset 0 1px 0 rgba(255, 255, 255, .9);
      display: none;
      max-height: 340px;
      overflow: auto;
      z-index: 40
    }

    .sug.show {
      display: block;
      animation: fadeUp .18s both
    }

    .si {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 8px 10px;
      border-radius: 14px;
      text-align: left;
      border: 1.5px solid transparent;
      transition: .12s
    }

    .si:hover,
    .si.on {
      background: var(--p-cont);
      border-color: var(--p)
    }

    .si .th {
      width: 46px;
      height: 46px;
      border-radius: 11px;
      flex-shrink: 0;
      background-color: var(--p-cont);
      background-size: cover;
      background-position: center
    }

    .si .t {
      flex: 1;
      min-width: 0
    }

    .si b {
      display: block;
      font-size: 13.5px
    }

      flex-direction: column;
      gap: 10px;
      min-width: 0

      margin-bottom: 0

    @media(min-width:900px) {
      .parkcols {
        grid-template-columns: 1.7fr 1fr;
        align-items: start
      }

      .parkcols .pside {
        max-height: min(58vh, 430px);
        overflow: hidden
      }

      .parkcols .pside .plist {
        flex: 1;
        min-height: 0;
        overflow: auto;
        grid-template-columns: 1fr;
        padding-right: 3px;
        -webkit-mask-image: linear-gradient(180deg, #000 calc(100% - 16px), transparent);
        mask-image: linear-gradient(180deg, #000 calc(100% - 16px), transparent)

      .parkcols .pside .plist::-webkit-scrollbar {
        width: 6px

      .parkcols .pside .plist::-webkit-scrollbar-thumb {
        background: var(--p-300);
        border-radius: 9px

        min-width: 0;
        padding: 8px 9px;
        gap: 9px
      }

        white-space: normal;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        line-height: 1.25
      }

      .parkcols .pside .plist .zn {
        display: none
      }

      .parkcols .pside .acts {
        gap: 8px
      }

      .parkcols {
        gap: 10px

    function canAutoScroll(slider) {
      if (!slider) return false;
      if (slider._isInteracting) return false;
      if (Date.now() < (slider._manualPauseUntil || 0)) return false;
      const rect = slider.getBoundingClientRect();
      return rect.bottom > 60 && rect.top < window.innerHeight - 60;
    }

    function attachManualScrollTracker(slider) {
      if (!slider || slider._hasManualTracker) return;
      slider._hasManualTracker = true;
      slider._manualPauseUntil = 0;
      slider._isInteracting = false;

      let startX = 0, startY = 0, trackingTouch = false;

      const pauseManual = (ms = 6000) => {
        slider._manualPauseUntil = Math.max(slider._manualPauseUntil || 0, Date.now() + ms);
      };

      slider.addEventListener('touchstart', (e) => {
        if (e.touches && e.touches.length === 1) {
          startX = e.touches[0].clientX;
          startY = e.touches[0].clientY;
          trackingTouch = true;
        }
      }, { passive: true });

      slider.addEventListener('touchmove', (e) => {
        if (!trackingTouch || !e.touches || e.touches.length !== 1) return;
        const dx = Math.abs(e.touches[0].clientX - startX);
        const dy = Math.abs(e.touches[0].clientY - startY);
        if (dx > dy && dx > 8) {
          slider._isInteracting = true;
          pauseManual(6000);
        }
      }, { passive: true });

      slider.addEventListener('touchend', () => {
        trackingTouch = false;
        slider._isInteracting = false;
      }, { passive: true });

      slider.addEventListener('touchcancel', () => {
        trackingTouch = false;
        slider._isInteracting = false;
      }, { passive: true });

      slider.addEventListener('wheel', (e) => {
        if (Math.abs(e.deltaX) > Math.abs(e.deltaY) && Math.abs(e.deltaX) > 4) {
          pauseManual(6000);
        }
      }, { passive: true });
    }

      btn.disabled = true; const h = btn.innerHTML;
      btn.innerHTML = `<span class="spin" style="border-color:var(--p-200);border-top-color:var(--p)"></span> ${L('Mengunduh…')}`;
      try { save(await notaBlob(cur), `NOTA-${cur.nota || cur.code}.jpg`) } catch (e) { toast(L('Gagal mengunduh nota.'), true) } finally { btn.disabled = false; btn.innerHTML = h }
    }
    const mqPark = matchMedia('(max-width:719px)');
    mqPark.addEventListener('change', () => { const m = $('#parkModal'); if (m && m.classList.contains('show')) fillParkModal(); else if (tab === 'peta' && $('#tbody')) drawTab(false) });
    renderShell(); route();
  </script>
</body>

</html>
