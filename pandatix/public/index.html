<!doctype html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1B6B44">
  <meta name="description"
    content="Pesan tiket wahana Lembah Pandawa — Bali Van Java, Pandaan. Pilih paket, bayar, tiket QR langsung terbit.">
  <title>PANDATIX · Taket Wahana Lembah Pandawa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/app.css?v=glass4">
  <style>
    html {
      scroll-behavior: auto
    }

    :root {
      --hh: 63px
    }

    @media(max-width:560px) {
      :root {
        --hh: 61px
      }
    }

    @media(max-width:340px) {
      :root {
        --hh: 55px
      }
    }

    .page {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 18px 16px 40px;
      animation: fadeUp .4s cubic-bezier(.22, .9, .3, 1) both
    }

    .narrow {
      max-width: 640px
    }

    .bleed {
      width: 100vw;
      margin-left: calc(50% - 50vw)
    }

    /* header */
    #shellTop {
      display: contents
    }

    .hdr .hwrap {
      max-width: 1100px;
      gap: 10px
    }

    .hspacer {
      flex: 1;
      min-width: 0
    }

    .hactions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0
    }

    .hdr-search-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: linear-gradient(180deg, rgba(255, 255, 255, .75), rgba(255, 255, 255, .45));
      border: 1px solid rgba(255, 255, 255, .8);
      color: var(--ink);
      -webkit-backdrop-filter: blur(14px) saturate(1.6);
      backdrop-filter: blur(14px) saturate(1.6);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .82), 0 4px 12px -8px rgba(8, 34, 24, .45);
      cursor: pointer;
      transition: background .15s, border-color .15s, color .15s, transform .12s;
    }

    .hdr-search-btn:hover {
      background: #ffffff;
      color: var(--p);
      border-color: rgba(27, 107, 68, .35);
    }

    .hdr-search-btn:active {
      transform: scale(.93);
    }

    .locbtn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      height: 37px;
      padding: 0 14px;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(255, 255, 255, .62), rgba(228, 243, 234, .44));
      border: 1px solid rgba(255, 255, 255, .66);
      color: var(--p-dark);
      font-weight: 700;
      font-size: 13px;
      flex-shrink: 0;
      -webkit-backdrop-filter: blur(14px) saturate(1.6);
      backdrop-filter: blur(14px) saturate(1.6);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .72), 0 6px 16px -13px rgba(8, 34, 24, .65);
      transition: background .15s, transform .15s
    }

    .locbtn:hover {
      background: linear-gradient(180deg, rgba(255, 255, 255, .8), rgba(228, 243, 234, .6))
    }

    .locbtn:active {
      transform: scale(.96)
    }

    .lang-flags {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 3px 5px;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(255, 255, 255, .65), rgba(255, 255, 255, .4));
      border: 1px solid rgba(255, 255, 255, .75);
      -webkit-backdrop-filter: blur(14px) saturate(1.6);
      backdrop-filter: blur(14px) saturate(1.6);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .8), 0 6px 16px -13px rgba(8, 34, 24, .5);
      flex-shrink: 0
    }

    .flag-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 29px;
      padding: 0 8px;
      border-radius: 999px;
      border: 1.5px solid transparent;
      background: transparent;
      cursor: pointer;
      opacity: .52;
      transition: opacity .15s, background .15s, transform .15s, border-color .15s, box-shadow .15s
    }

    .flag-btn:hover {
      opacity: .85;
      background: rgba(255, 255, 255, .42)
    }

    .flag-btn.on {
      opacity: 1;
      background: linear-gradient(180deg, rgba(255, 255, 255, .95), rgba(240, 248, 243, .85));
      border-color: rgba(27, 107, 68, .35);
      box-shadow: 0 2px 8px -2px rgba(10, 40, 30, .28), inset 0 1px 0 #fff;
      transform: scale(1.03)
    }

    .flag-btn:active {
      transform: scale(.95)
    }

    .flag-svg {
      border-radius: 3px;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, .15);
      overflow: hidden;
      display: block
    }

    .lang {
      position: relative;
      flex-shrink: 0
    }

    .langbtn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 38px;
      padding: 0 13px 0 15px;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(255, 255, 255, .6), rgba(255, 255, 255, .36));
      border: 1px solid rgba(255, 255, 255, .68);
      color: var(--ink);
      font-weight: 800;
      font-size: 12.5px;
      letter-spacing: .02em;
      -webkit-backdrop-filter: blur(14px) saturate(1.6);
      backdrop-filter: blur(14px) saturate(1.6);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .78), 0 6px 16px -13px rgba(8, 34, 24, .6);
      transition: background .15s, border-color .15s, transform .15s
    }

    .langbtn:hover {
      background: linear-gradient(180deg, rgba(255, 255, 255, .78), rgba(255, 255, 255, .52));
      border-color: rgba(27, 107, 68, .4);
      color: var(--p)
    }

    .langbtn:active {
      transform: scale(.96)
    }

    .langbtn .cv {
      display: inline-flex;
      color: var(--ink-3);
      transition: transform .22s cubic-bezier(.22, .9, .3, 1)
    }

    .lang.open .langbtn {
      border-color: rgba(27, 107, 68, .55);
      background: linear-gradient(180deg, rgba(255, 255, 255, .85), rgba(228, 243, 234, .62));
      color: var(--p-dark)
    }

    .lang.open .langbtn .cv {
      transform: rotate(180deg)
    }

    .langmenu {
      position: absolute;
      right: 0;
      top: calc(100% + 8px);
      min-width: 216px;
      padding: 6px;
      border-radius: 16px;
      background: rgba(255, 255, 255, .9);
      border: 1px solid rgba(255, 255, 255, .85);
      box-shadow: 0 22px 44px -20px rgba(10, 40, 30, .45), inset 0 1px 0 rgba(255, 255, 255, .9);
      -webkit-backdrop-filter: blur(22px) saturate(1.7);
      backdrop-filter: blur(22px) saturate(1.7);
      display: none;
      z-index: 60
    }

    .lang.open .langmenu {
      display: block;
      animation: fadeUp .18s both
    }

    .langopt {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      width: 100%;
      min-height: 44px;
      padding: 9px 12px;
      border-radius: 11px;
      text-align: left;
      color: var(--ink);
      transition: background .12s
    }

    .langopt:hover {
      background: var(--p-cont)
    }

    .langopt.on {
      background: var(--p-cont);
      color: var(--p-dark)
    }

    .langopt .lgtxt {
      display: flex;
      align-items: baseline;
      gap: 8px;
      min-width: 0
    }

    .langopt b {
      font-size: 13.5px;
      font-weight: 700;
      white-space: nowrap
    }

    .langopt i {
      font-style: normal;
      font-size: 10.5px;
      font-weight: 800;
      color: var(--ink-3);
      letter-spacing: .06em
    }

    .langopt svg {
      color: var(--p);
      flex-shrink: 0
    }

    /* footer: dark panel with layered wave top (Footer frame) */
    .ftr {
      position: relative;
      margin-top: 54px;
      background: transparent;
      border: 0;
      padding: 0;
      color: #C3D9CC
    }

    .ftr .fwave {
      display: block;
      width: 100%;
      height: 52px
    }

    .ftr .fwave svg {
      display: block;
      width: 100%;
      height: 100%
    }

    .ftr .fp {
      background: #143A2B;
      padding: 4px 0 46px
    }

    .ftr .wrap {
      max-width: 1100px
    }

    .ftr .lg {
      display: block;
      font-weight: 800;
      font-size: 30px;
      letter-spacing: -.03em;
      color: #fff;
      margin: 0 0 15px
    }

    .ftr .ds {
      font-size: 16px;
      line-height: 1.6;
      color: #C0D6C9;
      max-width: 560px;
      margin: 0 0 30px
    }

    .ftr .fi {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      margin: 0 0 21px
    }

    .ftr .fi .ic {
      color: #D3E6DB;
      margin-top: 1px;
      display: flex
    }

    .ftr .fi b {
      display: block;
      color: #fff;
      font-size: 15.5px;
      font-weight: 700;
      line-height: 1.35
    }

    .ftr .fi .tx span {
      display: block;
      color: #C0D6C9;
      font-size: 15px;
      line-height: 1.5;
      margin-top: 2px
    }

    .ftr .ig {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      height: 48px;
      padding: 0 22px;
      border-radius: 999px;
      border: 1.5px solid rgba(255, 255, 255, .28);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      margin-top: 7px;
      transition: background .2s, border-color .2s
    }

    .ftr .ig:hover {
      background: rgba(255, 255, 255, .08);
      border-color: rgba(255, 255, 255, .48)
    }

    .ftr .hr {
      height: 1px;
      background: rgba(255, 255, 255, .16);
      margin: 30px 0 20px
    }

    .ftr .cp {
      font-size: 14.5px;
      color: #8EA89B;
      margin: 0
    }

    /* hero promo banner */
    .hero {
      position: relative;
      z-index: 2;
      isolation: isolate;
      background: #143A2B;
      margin-top: calc(-1 * var(--hh));
      padding-top: var(--hh);
      overflow: hidden;
      border-bottom: 1px solid rgba(0, 0, 0, .06);
    }

    .hero-slider {
      position: relative;
      width: 100%;
      max-width: 1024px;
      margin: 0 auto;
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      scroll-behavior: smooth;
    }

    .hero-slider::-webkit-scrollbar {
      display: none;
    }

    .hero-slide {
      flex: 0 0 100%;
      width: 100%;
      scroll-snap-align: center;
      scroll-snap-stop: always;
      display: flex;
      justify-content: center;
      line-height: 0;
    }

    .hero-banner-img {
      width: 100%;
      max-width: 1024px;
      height: auto;
      display: block;
    }

    .slider-dots {
      position: absolute;
      bottom: 12px;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      z-index: 5;
      pointer-events: auto;
    }

    .s-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .42);
      border: none;
      padding: 0;
      cursor: pointer;
      transition: width .28s cubic-bezier(.22, 1, .36, 1), background .25s ease, transform .25s ease;
    }

    .s-dot:hover {
      background: rgba(255, 255, 255, .78);
    }

    .s-dot.on {
      width: 22px;
      background: #ffffff;
      box-shadow: 0 1px 6px rgba(0, 0, 0, .35);
    }

    .fav-dots-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 14px 0 4px;
    }

    .fav-dots-wrap .s-dot {
      background: rgba(255, 255, 255, .32);
    }

    .fav-dots-wrap .s-dot:hover {
      background: rgba(255, 255, 255, .6);
    }

    .fav-dots-wrap .s-dot.on {
      width: 22px;
      background: #A3E635;
      box-shadow: 0 1px 6px rgba(163, 230, 53, .45);
    }

    .wxwrap {
      position: relative;
      align-self: flex-start;
      padding-top: 27px;
      animation: fadeUp .6s .05s both
    }

    .wxship {
      position: absolute;
      left: 5px;
      top: 0;
      width: 46px;
      height: 27px;
      display: flex;
      align-items: flex-end;
      pointer-events: none;
      animation: wxpace 15s ease-in-out infinite alternate;
      will-change: transform
    }

    .wxship svg {
      display: block;
      width: 100%;
      height: auto;
      filter: drop-shadow(0 2px 3px rgba(10, 32, 24, .3));
      transform-origin: 50% 88%;
      animation: wxbob 5.2s ease-in-out infinite alternate;
      will-change: transform
    }

    .wx {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      height: 38px;
      padding: 0 17px;
      border-radius: 999px;
      background: linear-gradient(150deg, rgba(255, 255, 255, .34), rgba(255, 255, 255, .14));
      border: 1px solid rgba(255, 255, 255, .5);
      -webkit-backdrop-filter: blur(16px) saturate(1.7);
      backdrop-filter: blur(16px) saturate(1.7);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      text-shadow: 0 1px 6px rgba(6, 28, 20, .4);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .58), 0 10px 24px -16px rgba(6, 28, 20, .7)
    }

    .wx b {
      font-weight: 700
    }

    .wx s {
      width: 1px;
      height: 16px;
      background: rgba(255, 255, 255, .5)
    }

    .wx .sun {
      color: #F6C85B;
      display: inline-flex
    }

    .hero h1 {
      color: #fff;
      font-size: clamp(29px, 4.6vw, 44px);
      line-height: 1.14;
      max-width: 620px;
      font-weight: 700;
      letter-spacing: -.025em;
      text-shadow: 0 2px 12px rgba(10, 32, 24, .42), 0 1px 2px rgba(10, 32, 24, .28);
      animation: fadeUp .6s .12s both
    }

    .hero p {
      color: rgba(255, 255, 255, .93);
      font-size: 15px;
      line-height: 1.55;
      max-width: 480px;
      text-shadow: 0 1px 8px rgba(10, 32, 24, .55), 0 1px 2px rgba(10, 32, 24, .35);
      animation: fadeUp .6s .2s both
    }

    @media(max-width:480px) {
      .hero h1 {
        font-size: 28px;
        letter-spacing: -.045em;
        line-height: 1.16
      }
    }

    @media(max-width:700px) {
      .hero-in {
        min-height: 544px;
        padding-bottom: 106px min-height: 460px;
        padding-bottom: 54px
      }

      .hero-curve svg {
        height: 30px
      }

      .ftr .fwave {
        height: 36px
      }

      .ftr .lg {
        font-size: 26px
      }

      .ftr .ds {
        font-size: 15px
      }

      .ftr .fi .tx span {
        font-size: 14.5px
      }

      .ftr .fp {
        padding-bottom: 38px
      }
    }

    @media(prefers-reduced-motion:reduce) {

      .hero-art .cl,
      .hero-art .tr,
      .hero-art .wv,
      .hero-art .bk,
      .hero-art .wing,
      .hero-art .lv,
      .hero-art .lf,
      .hero-art .gl,
      .wxship,
      .wxship svg {
        animation: none
      }
    }

    /* search */
    .search {
      position: relative;
      z-index: 20;
      animation: fadeUp .6s .28s both
    }

    .sbar {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 60px;
      padding: 0 8px 0 25px;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(255, 255, 255, .74), rgba(255, 255, 255, .56));
      border: 1px solid rgba(255, 255, 255, .8);
      -webkit-backdrop-filter: blur(22px) saturate(1.7);
      backdrop-filter: blur(22px) saturate(1.7);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .9), 0 18px 36px -20px rgba(8, 34, 24, .7);
      transition: border-color .18s, box-shadow .18s
    }

    .sbar:focus-within,
    .sbar.open {
      border-color: rgba(27, 107, 68, .5);
      box-shadow: 0 0 0 4px rgba(27, 107, 68, .16), inset 0 1px 0 rgba(255, 255, 255, .95), 0 18px 36px -20px rgba(8, 34, 24, .7)
    }

    .sbar input {
      flex: 1;
      min-width: 0;
      height: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      font-size: 15.5px;
      color: var(--ink)
    }

    .sbar input::placeholder {
      color: #4F5E56
    }

    .sgo {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: linear-gradient(180deg, #1E7A4A, #166534);
      color: #fff;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .22), 0 6px 14px -8px rgba(10, 50, 30, .8);
      transition: .15s
    }

    .sgo:hover {
      background: linear-gradient(180deg, #248A55, #1B7A42)
    }

    .sgo:active {
      transform: scale(.92)
    }

    .sug {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 8px);
      background: rgba(255, 255, 255, .92);
      border: 1px solid rgba(27, 107, 68, .32);
      border-radius: 20px;
      padding: 6px;
      -webkit-backdrop-filter: blur(24px) saturate(1.6);
      backdrop-filter: blur(24px) saturate(1.6);
      box-shadow: 0 22px 44px -20px rgba(18, 72, 46, .5), inset 0 1px 0 rgba(255, 255, 255, .9);
      display: none;
      max-height: 340px;
      overflow: auto;
      z-index: 40
    }

    .sug.show {
      display: block;
      animation: fadeUp .18s both
    }

    .si {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 8px 10px;
      border-radius: 14px;
      text-align: left;
      border: 1.5px solid transparent;
      transition: .12s
    }

    .si:hover,
    .si.on {
      background: var(--p-cont);
      border-color: var(--p)
    }

    .si .th {
      width: 46px;
      height: 46px;
      border-radius: 11px;
      flex-shrink: 0;
      background-color: var(--p-cont);
      background-size: cover;
      background-position: center
    }

    .si .t {
      flex: 1;
      min-width: 0
    }

    .si b {
      display: block;
      font-size: 13.5px
    }

    .si span {
      font-size: 11px;
      color: var(--ink-3)
    }

    .si em {
      font-style: normal;
      font-weight: 800;
      color: var(--p);
      font-size: 13px;
      white-space: nowrap
    }

    .snone {
      padding: 18px;
      text-align: center;
      color: var(--ink-3);
      font-size: 13px
    }

    .mytix {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 18px 0 0;
      padding: 12px 16px;
      border-radius: 9px;
      background: var(--p-cont);
      border: 1.5px solid var(--p-200);
      font-size: 13.5px;
      font-weight: 700;
      color: var(--p-dark)
    }

    .mytix .r {
      display: inline-flex;
      gap: 4px;
      align-items: center
    }

    /* sections */
    .sec {
      margin-top: 34px
    }

    .sec-h {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px
    }

    .sec-h h2 {
      font-size: 22px;
      letter-spacing: -.02em
    }

    .sec-h .sub {
      font-size: 13px;
      color: var(--ink-2);
      margin-top: 3px
    }

    .sec-h .side {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--ink-2);
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 5px
    }

    /* package cards */
    .pgrid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px
    }

    .pk {
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border-width: 1.5px;
      border-color: var(--line);
      border-radius: 11px;
      transition: box-shadow .25s ease, border-color .25s;
      transform: none !important;
    }

    .pk:hover {
      box-shadow: 0 14px 32px -12px rgba(18, 72, 46, .24);
      border-color: rgba(27, 107, 68, .35);
    }

    .pk.popular {
      border-color: #10B981;
      box-shadow: 0 0 0 2px #10B981, 0 16px 36px -10px rgba(16, 185, 129, .38);
    }

    .pk-header {
      padding: 17px 17px 11px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .pk-pop-badge {
      display: inline-flex;
      align-items: center;
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: .05em;
      text-transform: uppercase;
      color: #064E3B;
      background: linear-gradient(135deg, #A7F3D0 0%, #34D399 100%);
      border: 1px solid #059669;
      padding: 3px 8px;
      border-radius: 5px;
      white-space: nowrap;
      box-shadow: 0 0 14px rgba(16, 185, 129, .55), 0 2px 6px rgba(6, 78, 59, .2);

      font-size: 10px;
      line-height: 1;
      font-weight: 800;
      color: var(--p);
      background: #fff;
      border: 1px solid var(--p-200);
      padding: 3px 7px;
      border-radius: 999px;
      flex-shrink: 0
    }

    .nota {
      padding: 22px
    }

    .nota .nh {
      display: flex;
      justify-content: space-between;
      align-items: center
    }

    .nota h3 {
      font-size: 19px;
      margin: 0
    }

    .nota .nm {
      display: flex;
      justify-content: space-between;
      color: var(--ink-2);
      font-size: 13px;
      padding: 8px 0 14px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 12px
    }

    .nr {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 6px 0;
      font-size: 14px;
      color: var(--ink-2)
    }

    .nr b {
      color: var(--ink);
      font-size: 15px;
      white-space: nowrap
    }

    .nr .mt {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 800;
      color: var(--ink)
    }

    .nt {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--line);
      margin-top: 8px;
      padding-top: 15px;
      font-weight: 800;
      font-size: 17px
    }

    .nt b {
      font-size: 24px;
      color: var(--p);
      letter-spacing: -.02em
    }

    .chip.blue {
      background: #E3F1F6;
      color: var(--ocean)
    }

    .chip.gold {
      background: var(--s-cont);
      color: var(--s-dark)
    }

    .chip.grey {
      background: var(--surface);
      color: var(--ink-3)
    }

    /* undo */
    .ut {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translate(-50%, 80px);
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--ink);
      color: #fff;
      padding: 12px 12px 12px 20px;
      border-radius: 999px;
      font-size: 13.5px;
      font-weight: 600;
      z-index: 210;
      opacity: 0;
      transition: .3s cubic-bezier(.22, .9, .3, 1);
      box-shadow: 0 16px 36px -12px rgba(0, 0, 0, .5);
      max-width: 92vw
    }

    .ut.show {
      opacity: 1;
      transform: translate(-50%, 0)
    }

    .ut button {
      background: var(--p);
      color: #fff;
      font-weight: 800;
      font-size: 13px;
      padding: 8px 16px;
      border-radius: 999px;
      transition: .15s
    }

    .ut button:hover {
      background: var(--p-hover)
    }

    /* tunggu */
    .wait {
      padding: 26px 22px 22px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px
    }

    .hg-c {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      background: var(--s-cont);
      color: var(--s-dark);
      display: grid;
      place-items: center;
      animation: pop .5s both
    }

    .hg-c svg {
      animation: flip 3s ease-in-out infinite
    }

    @keyframes flip {

      0%,
      42% {
        transform: rotate(0)
      }

      58%,
      100% {
        transform: rotate(180deg)
      }
    }

    .wait h2 {
      font-size: 25px
    }

    .wait .s {
      color: var(--ink-2);
      font-size: 14px;
      max-width: 300px;
      line-height: 1.5
    }

    .qrb {
      width: min(100%, 290px);
      aspect-ratio: 1;
      border: 2px dashed var(--p);
      border-radius: 26px;
      display: grid;
      place-items: center;
      padding: 22px;
      background: #fff;
      position: relative;
      overflow: hidden
    }

    .qrb svg {
      width: 100%;
      height: 100%
    }

    .scanp {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      height: 40px;
      padding: 0 18px;
      border-radius: 999px;
      background: var(--s-cont);
      border: 1px solid var(--s-300);
      color: var(--s-dark);
      font-weight: 700;
      font-size: 13px
    }

    .scanp i {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--s);
      animation: pulse 1.4s infinite
    }

    .kv {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      border-top: 1px solid var(--line);
      padding-top: 16px;
      text-align: left
    }

    .kv small {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--ink-2);
      margin-bottom: 4px
    }

    .kv b {
      font-size: 20px;
      letter-spacing: -.01em
    }

    .kv .chip {
      background: var(--s-cont);
      color: var(--s-dark);
      height: 26px
    }

    .tipb {
      display: flex;
      gap: 12px;
      background: var(--surface);
      border-radius: 15px;
      padding: 15px;
      text-align: left;
      font-size: 13px;
      color: var(--ink-2);
      line-height: 1.55;
      width: 100%
    }

    .tipb svg {
      color: var(--p);
      flex-shrink: 0;
      margin-top: 1px
    }

    /* tiket */
    .ok-e {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--p);
      font-weight: 800;
      font-size: 12.5px;
      letter-spacing: .06em;
      text-transform: uppercase;
      margin-top: 8px
    }

    .ok-e svg {
      animation: pop .6s both
    }

    .dlall {
      margin: 16px 0 14px
    }

    .cnt {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--p);
      font-weight: 800;
      font-size: 13px;
      margin-bottom: 20px
    }

    .seg3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background: var(--bg);
      border: 1.5px solid var(--line);
      border-radius: 999px;
      padding: 4px;
      margin-bottom: 20px;
      position: relative
    }

    .seg3 button {
      height: 44px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 13.5px;
      color: var(--ink-2);
      position: relative;
      z-index: 1;
      transition: color .25s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px
    }

    .seg3 button.on {
      color: #fff
    }

    .seg3 .knob {
      position: absolute;
      top: 4px;
      bottom: 4px;
      left: 4px;
      width: calc(33.333% - 4px);
      border-radius: 999px;
      background: linear-gradient(180deg, #1F7449, #165A38);
      transition: transform .35s cubic-bezier(.4, 1.3, .5, 1);
      box-shadow: 0 3px 0 #0F3F28
    }

    .seg3[data-t="nota"] .knob {
      transform: translateX(100%)
    }

    .seg3[data-t="peta"] .knob {
      transform: translateX(200%)
    }

    .tkts {
      display: grid;
      gap: 16px
    }

    .tk {
      padding: 20px 22px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      animation: fadeUp .5s both
    }

    .tk .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11.5px;
      font-weight: 800;
      letter-spacing: .04em;
      color: var(--ink-2)
    }

    .tk h3 {
      font-size: 25px;
      line-height: 1.1;
      margin-bottom: 4px
    }

    .tk .vd {
      font-size: 13.5px;
      color: var(--ink-2)
    }

    .tk .row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      border-top: 1px solid var(--line);
      padding-top: 14px
    }

    .tk .row small {
      display: block;
      font-size: 12px;
      color: var(--ink-2);
      margin-bottom: 3px
    }

    .tk .row b {
      font-size: 15px
    }

    .tk .row .pr {
      color: var(--p);
      font-size: 18px
    }

    .tk .bt {
      display: flex;
      align-items: center;
      gap: 13px
    }

    .qrs {
      width: 74px;
      height: 74px;
      border: 1.5px solid var(--line);
      border-radius: 13px;
      padding: 7px;
      background: #fff;
      flex-shrink: 0;
      position: relative;
      cursor: zoom-in;
      transition: .15s
    }

    .qrs:hover {
      border-color: var(--p);
      transform: scale(1.04)
    }

    .qrs svg {
      width: 100%;
      height: 100%
    }

    .tk .kd {
      flex: 1;
      min-width: 0
    }

    .tk .kd small {
      display: block;
      font-size: 11.5px;
      color: var(--ink-2)
    }

    .tk .kd b {
      display: block;
      font-size: 17px;
      letter-spacing: .04em;
      margin: 2px 0
    }

    .tk.used .qrs svg {
      opacity: .18
    }

    .tk.used .qrs::after {
      content: "TERPAKAI";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 9px;
      font-weight: 800;
      color: var(--s-dark);
      letter-spacing: .05em
    }

    html[lang="en"] .tk.used .qrs::after {
      content: "USED"
    }

    .rides {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      border-top: 1px dashed var(--line-2);
      padding-top: 13px
    }

    .rd {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 28px;
      padding: 0 12px;
      border-radius: 999px;
      background: var(--p-cont);
      color: var(--p-dark);
      font-size: 12px;
      font-weight: 700
    }

    .rd.u {
      background: var(--s-cont);
      color: var(--s);
      text-decoration: line-through
    }

    .petunjuk {
      display: flex;
      gap: 13px;
      padding: 20px;
      margin-top: 18px;
      border-radius: 20px;
      border: 1.5px solid var(--p-200);
      background: linear-gradient(180deg, var(--p-cont), #fff)
    }

    .petunjuk svg {
      color: var(--p);
      flex-shrink: 0
    }

    .petunjuk b {
      display: block;
      font-size: 14.5px;
      margin-bottom: 4px
    }

    .petunjuk p {
      font-size: 13px;
      color: var(--ink-2);
      line-height: 1.55
    }

    .pnota {
      padding: 22px;
      animation: fadeUp .4s both
    }

    .pnota .h {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--line);
      padding-bottom: 15px;
      margin-bottom: 15px
    }

    .pnota h3 {
      font-size: 20px
    }

    .pnota .meta {
      display: flex;
      justify-content: space-between;
      margin-bottom: 16px;
      gap: 10px
    }

    .pnota .meta small {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--ink-2);
      margin-bottom: 3px
    }

    .pnota .meta span {
      font-size: 13.5px;
      color: var(--ink-2)
    }

    .pnota .meta b {
      font-size: 15px
    }

    .again {
      margin-top: 16px
    }

    /* park map */
    .peta {
      padding: 22px
    }

    .parkmap {
      border-radius: 16px;
      overflow: hidden;
      border: 1.5px solid var(--line);
      background: #EAF3EC;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .6)
    }

    .parkmap svg {
      display: block;
      width: 100%;
      height: auto
    }

    .parkcols {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 12px
    }

    .parkcols>* {
      min-width: 0
    }

    .parkcols .pside {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 0
    }

    .parkcols .pside .plist {
      margin-bottom: 0
    }

    @media(min-width:900px) {
      .parkcols {
        grid-template-columns: 1.7fr 1fr;
        align-items: start
      }

      .parkcols .pside {
        max-height: min(58vh, 430px);
        overflow: hidden
      }

      .parkcols .pside .plist {
        flex: 1;
        min-height: 0;
        overflow: auto;
        grid-template-columns: 1fr;
        padding-right: 3px;
        -webkit-mask-image: linear-gradient(180deg, #000 calc(100% - 16px), transparent);
        mask-image: linear-gradient(180deg, #000 calc(100% - 16px), transparent)
      }

      .parkcols .pside .plist::-webkit-scrollbar {
        width: 6px
      }

      .parkcols .pside .plist::-webkit-scrollbar-thumb {
        background: var(--p-300);
        border-radius: 9px
      }

      .parkcols .pside .plist button {
        min-width: 0;
        padding: 8px 9px;
        gap: 9px
      }

      .parkcols .pside .plist .nm {
        white-space: normal;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        line-height: 1.25
      }

      .parkcols .pside .plist .zn {
        display: none
      }

      .parkcols .pside .acts {
        gap: 8px
      }
    }

    @media(max-width:719px) {
      .parkcols {
        gap: 10px
      }

      .plist {
        gap: 7px
      }
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 12px;
      margin: 10px 0;
      font-size: 11.5px;
      color: var(--ink-2);
      font-weight: 600
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 6px
    }

    .legend i {
      width: 11px;
      height: 11px;
      border-radius: 50%
    }

    .peta .info {
      display: flex;
      gap: 12px;
      padding: 12px;
      border-radius: 16px;
      background: var(--p-cont);
      border: 1.5px solid var(--p-200);
      margin-bottom: 10px
    }

    .peta .info .im {
      width: 64px;
      height: 64px;
      border-radius: 12px;
      flex-shrink: 0;
      background-size: cover;
      background-position: center
    }

    .peta .info .t {
      flex: 1;
      min-width: 0
    }

    .peta .info b {
      font-size: 14.5px
    }

    .peta .info p {
      font-size: 12px;
      color: var(--ink-2);
      margin: 3px 0 8px
    }

    .peta .info .st {
      display: flex;
      gap: 7px;
      flex-wrap: wrap
    }

    .plist {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 8px;
      margin-bottom: 14px
    }

    .plist button {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
      padding: 9px 12px;
      border-radius: 13px;
      border: 1.5px solid var(--line);
      background: var(--bg);
      text-align: left;
      transition: .14s
    }

    .plist button:hover {
      border-color: var(--p-300)
    }

    .plist button.sel {
      border-color: var(--p);
      background: var(--p-cont)
    }

    .plist .num {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 12px;
      font-weight: 800;
      flex-shrink: 0
    }

    .plist .nm {
      flex: 1;
      min-width: 0;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .plist .zn {
      font-size: 11px;
      color: var(--ink-3);
      font-weight: 600;
      white-space: nowrap
    }

    .peta .acts {
      display: flex;
      gap: 9px;
      flex-wrap: wrap
    }

    .pin {
      cursor: pointer
    }

    .pin .dot {
      transition: transform .16s;
      transform-box: fill-box;
      transform-origin: center
    }

    .pin:hover .dot {
      transform: scale(1.07)
    }

    .pin .halo {
      opacity: 0
    }

    .pin.sel .halo {
      opacity: 1;
      animation: pulse 1.8s infinite
    }

    .pin.sel .dot {
      stroke: #1B6B44;
      stroke-width: 4
    }

    /* modals */
    .modal {
      position: fixed;
      inset: 0;
      z-index: 150;
      background: rgba(10, 30, 20, .55);
      backdrop-filter: blur(4px);
      display: none;
      place-items: center;
      padding: 18px
    }

    .modal.show {
      display: grid;
      animation: fadeUp .2s both
    }

    .modal .in {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      width: min(94vw, 480px);
      max-height: 90vh;
      max-height: calc(100dvh - 36px);
      overflow: auto;
      animation: pop .3s both;
      box-shadow: 0 30px 70px -24px rgba(0, 0, 0, .5)
    }

    /* search modal */
    .sm-head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .sm-inp-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      background: var(--surface);
      border: 1.5px solid var(--line);
      border-radius: 7px;
      padding: 0 11px;
      height: 42px;
      gap: 8px;
      transition: border-color .15s, box-shadow .15s;
    }

    .sm-inp-wrap:focus-within {
      border-color: var(--p);
      box-shadow: 0 0 0 3px rgba(27, 107, 68, .12);
      background: #fff;
    }

    .sm-icon {
      color: var(--ink-3);
      display: flex;
    }

    .sm-input {
      flex: 1;
      border: none;
      background: transparent;
      outline: none;
      font-size: 14px;
      color: var(--ink);
    }

    .sm-input::placeholder {
      color: var(--ink-3);
    }

    .sm-clear {
      display: none;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 5px;
      background: rgba(0, 0, 0, .07);
      color: var(--ink-2);
      cursor: pointer;
    }

    .sm-clear:hover {
      background: rgba(0, 0, 0, .14);
    }

    .sm-results {
      max-height: min(60vh, 380px);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-right: 2px;
    }

    .sm-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--ink-3);
      padding: 4px 2px;
    }

    .sm-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 10px;
      border-radius: 7px;
      border: 1px solid transparent;
      background: #fff;
      text-align: left;
      cursor: pointer;
      transition: background .12s, border-color .12s, transform .1s;
    }

    .sm-item:hover {
      background: var(--p-cont);
      border-color: rgba(27, 107, 68, .2);
      transform: translateX(2px);
    }

    .sm-thumb {
      width: 44px;
      height: 44px;
      border-radius: 6px;
      background-size: cover;
      background-position: center;
      flex-shrink: 0;
    }

    .sm-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .sm-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sm-name {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sm-tag {
      font-size: 9.5px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 3px;
      color: #fff;
    }

    .sm-desc {
      font-size: 11.5px;
      color: var(--ink-3);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sm-price {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
      flex-shrink: 0;
    }

    .sm-price b {
      font-size: 13px;
      color: var(--p);
      font-weight: 800;
    }

    .sm-view {
      font-size: 10.5px;
      color: var(--ink-3);
      display: inline-flex;
      align-items: center;
      gap: 2px;
    }

    .sm-empty {
      padding: 32px 16px;
      text-align: center;
      color: var(--ink-3);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .sm-empty p {
      font-size: 13.5px;
      margin: 0;
    }

    #parkModal .in {
      display: flex;
      flex-direction: column;
      overflow: hidden
    }

    #parkBody {
      flex: 1;
      min-height: 0;
      overflow: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      padding-right: 2px
    }

    #parkBody::-webkit-scrollbar {
      width: 6px
    }

    #parkBody::-webkit-scrollbar-thumb {
      background: var(--p-300);
      border-radius: 9px
    }

    @media(max-width:600px) {
      .modal {
        padding: 10px
      }

      .modal .in {
        padding: 14px;
        border-radius: 10px;
        max-height: calc(100dvh - 20px)
      }

      #parkModal .in {
        padding: 12px 10px 10px;
        border-radius: 10px
      }

      .mh {
        gap: 10px;
        margin-bottom: 10px
      }

      .mh h3 {
        font-size: 17.5px;
        line-height: 1.25
      }

      .mh p {

    function initHeroSlider() {
      const slider = $('#heroSlider');
      if (!slider) return;
      if (window.__heroTimer) clearInterval(window.__heroTimer);

      const slides = Array.from(slider.querySelectorAll('.hero-slide'));
      if (slides.length <= 1) return;

      let curIdx = 0;
      let paused = false;

      function getActiveIndex() {
        const sl = slider.scrollLeft;
        const w = slider.clientWidth || 1;
        return Math.min(slides.length - 1, Math.max(0, Math.round(sl / w)));
      }

      slider.addEventListener('scroll', () => {
        const idx = getActiveIndex();
        if (idx !== curIdx) {
          curIdx = idx;
          updateHeroDots(curIdx);
        }
      }, { passive: true });

      slider.addEventListener('pointerenter', () => { paused = true; });
      slider.addEventListener('pointerleave', () => { paused = false; });
      slider.addEventListener('touchstart', () => { paused = true; }, { passive: true });
      slider.addEventListener('touchend', () => {
        paused = false;
        curIdx = getActiveIndex();
      }, { passive: true });

      window.__heroTimer = setInterval(() => {
        if (paused) return;
        curIdx = (getActiveIndex() + 1) % slides.length;
        heroGo(curIdx);
      }, 4000);
    }

      function getFavIndex() {
        const sl = fav.scrollLeft;
        let bestIdx = 0, bestDist = Infinity;
        cards.forEach((c, i) => {
          const d = Math.abs((c.offsetLeft - fav.offsetLeft) - sl);
          if (d < bestDist) {

          }
        });
        return bestIdx;
      }

      fav.addEventListener('scroll', () => {

      }, { passive: true });

      fav.addEventListener('pointerleave', () => { paused = false; });

      }, 3500);
